<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --ink:20 12% 14%; --ink-soft:24 10% 38%;
    --paper:40 30% 97%; --sand-100:38 28% 93%; --sand-200:36 24% 88%; --sand-300:34 18% 78%;
    --burgundy-50:352 45% 95%; --burgundy-500:352 56% 26%; --burgundy-600:352 60% 20%;
    --gold-500:43 74% 52%; --gold-600:38 70% 44%;
    --danger-text:355 60% 40%;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font-family:'Cairo',system-ui,sans-serif; direction:rtl; background:hsl(var(--paper)); color:hsl(var(--ink)); display:flex; flex-direction:column; }
  .top { padding:36px 24px 0; text-align:center; }
  .mark { display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; border-radius:16px; background:hsl(var(--burgundy-500)); margin-bottom:14px; }
  h1 { font-size:20px; font-weight:800; margin:0 0 4px; }
  .sub { font-size:13px; color:hsl(var(--ink-soft)); margin:0; }
  .stepper { display:flex; align-items:center; justify-content:center; gap:8px; margin:20px 0 4px; }
  .dot { width:8px; height:8px; border-radius:50%; background:hsl(var(--sand-300)); }
  .dot.on { background:hsl(var(--burgundy-500)); width:22px; border-radius:4px; }
  .card { background:#fff; margin:16px 20px 0; padding:22px; border-radius:20px; box-shadow:0 8px 24px hsl(0 0% 0% / .06); }
  .card h3 { font-size:15px; font-weight:700; margin:0 0 16px; }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label { font-size:13px; font-weight:600; }
  .phone-wrap { display:flex; gap:8px; }
  .cc { flex:0 0 auto; padding:12px 10px; border-radius:10px; border:1.5px solid hsl(var(--sand-300)); background:hsl(var(--sand-100)); font-weight:700; font-size:14px; direction:ltr; }
  input { font-family:inherit; font-size:15px; padding:12px 14px; border-radius:10px; border:1.5px solid hsl(var(--sand-300)); background:#fff; width:100%; }
  input:focus { outline:none; border-color:hsl(var(--gold-600)); box-shadow:0 0 0 3px hsl(var(--gold-500) / .28); }
  .fwd { text-align:left; }
  .fwd a { font-size:13px; font-weight:700; color:hsl(var(--burgundy-500)); text-decoration:none; }
  .btn { width:100%; margin-top:16px; background:hsl(var(--burgundy-500)); color:hsl(var(--paper)); font-family:inherit; font-weight:700; font-size:15px; border:none; border-radius:12px; padding:14px; }
  .otp-boxes { display:flex; gap:10px; direction:ltr; justify-content:center; margin:6px 0 4px; }
  .otp-box { width:44px; height:52px; border-radius:10px; border:1.5px solid hsl(var(--sand-300)); background:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; }
  .otp-box.filled { border-color:hsl(var(--gold-600)); }
  .otp-box.active { border-color:hsl(var(--burgundy-500)); box-shadow:0 0 0 3px hsl(var(--gold-500) / .28); }
  .resend { text-align:center; font-size:12px; color:hsl(var(--ink-soft)); margin-top:14px; }
  .resend b { color:hsl(var(--burgundy-500)); }
  .err { font-size:12px; color:hsl(var(--danger-text)); font-weight:600; margin-top:-6px; margin-bottom:12px; }
  .foot { text-align:center; padding:24px; font-size:13px; color:hsl(var(--ink-soft)); margin-top:auto; }
  .foot a { font-weight:700; }
</style>
</helmet>

<div class="top">
  <div class="mark">
    <svg width="26" height="26" viewBox="0 0 64 64" fill="none" stroke="hsl(var(--gold-500))" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 26 L18 14 L24 24 L32 10 L40 24 L46 14 L54 26 L50 40 L14 40 Z"/>
    </svg>
  </div>
  <h1>تسجيل الدخول</h1>
  <p class="sub">أدخل بيانات حسابك في نايل كينجز</p>
  <div class="stepper"><span class="dot on"></span><span class="dot"></span></div>
</div>

<div class="card">
  <h3>١. رقم الهاتف وكلمة المرور</h3>
  <div class="field">
    <label>رقم الهاتف</label>
    <div class="phone-wrap">
      <input type="text" placeholder="1xxxxxxxxx" style="direction:ltr; text-align:left;">
      <span class="cc">+20</span>
    </div>
  </div>
  <div class="field" style="margin-bottom:6px;">
    <label>كلمة المرور</label>
    <input type="password" value="••••••••">
  </div>
  <div class="fwd"><a href="#">نسيت كلمة المرور؟</a></div>
  <button class="btn">متابعة</button>
</div>

<div class="card">
  <h3>٢. رمز التحقق (OTP)</h3>
  <p style="font-size:13px; color:hsl(var(--ink-soft)); margin:-8px 0 14px;">تم إرسال رمز مكوّن من ٤ أرقام إلى ‎01xxxxxxxxx</p>
  <div class="otp-boxes">
    <div class="otp-box filled">٧</div>
    <div class="otp-box filled">٣</div>
    <div class="otp-box active">٩</div>
    <div class="otp-box">&nbsp;</div>
  </div>
  <button class="btn">تأكيد</button>
  <p class="resend">إعادة الإرسال بعد <b>٠٠:٤٥</b></p>
</div>

<div class="foot">ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a></div>

</x-dc>
</body>
</html>
