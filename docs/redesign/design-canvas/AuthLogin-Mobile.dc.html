<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --papyrus:42 45% 97%; --stone-100:38 22% 93%; --stone-300:34 12% 76%;
    --lapis-900:228 44% 9%; --lapis-800:228 40% 14%;
    --ink:228 22% 14%; --ink-soft:225 10% 42%;
    --gold-500:42 78% 55%; --gold-600:38 74% 46%;
    --danger-text:8 62% 40%;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font-family:'Cairo',system-ui,sans-serif; direction:rtl; background:hsl(var(--papyrus)); color:hsl(var(--ink)); display:flex; flex-direction:column; }
  .top { padding:36px 24px 0; text-align:center; }
  .top img { height:52px; width:auto; margin-bottom:14px; }
  h1 { font-size:21px; font-weight:800; letter-spacing:-.01em; margin:0 0 4px; }
  .sub { font-size:13px; color:hsl(var(--ink-soft)); margin:0; }
  .stepper { display:flex; align-items:center; justify-content:center; gap:8px; margin:20px 0 4px; }
  .dot { width:8px; height:8px; border-radius:50%; background:hsl(var(--stone-300)); }
  .dot.on { background:hsl(var(--lapis-800)); width:22px; border-radius:4px; }
  .card { background:#fff; margin:16px 20px 0; padding:22px; border-radius:16px; border:1px solid hsl(var(--stone-100)); }
  .card h3 { font-size:15px; font-weight:800; margin:0 0 16px; }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label { font-size:13px; font-weight:700; }
  .phone-wrap { display:flex; gap:8px; }
  .cc { flex:0 0 auto; padding:12px 10px; border-radius:10px; border:1.5px solid hsl(var(--stone-300)); background:hsl(var(--stone-100)); font-weight:800; font-size:14px; direction:ltr; }
  input { font-family:inherit; font-size:15px; padding:12px 14px; border-radius:10px; border:1.5px solid hsl(var(--stone-300)); background:#fff; width:100%; }
  input:focus { outline:none; border-color:hsl(var(--gold-600)); box-shadow:0 0 0 3px hsl(var(--gold-500) / .3); }
  .fwd { text-align:left; }
  .fwd a { font-size:13px; font-weight:700; color:hsl(var(--lapis-800)); text-decoration:none; }
  .btn { width:100%; margin-top:16px; background:hsl(var(--lapis-800)); color:hsl(var(--papyrus)); font-family:inherit; font-weight:700; font-size:15px; border:none; border-radius:999px; padding:14px; cursor:pointer; }
  .btn:focus-visible { outline:3px solid hsl(var(--gold-500)); outline-offset:2px; }
  .otp-boxes { display:flex; gap:10px; direction:ltr; justify-content:center; margin:6px 0 4px; }
  .otp-box { width:44px; height:52px; border-radius:10px; border:1.5px solid hsl(var(--stone-300)); background:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; }
  .otp-box.filled { border-color:hsl(var(--gold-600)); }
  .otp-box.active { border-color:hsl(var(--lapis-800)); box-shadow:0 0 0 3px hsl(var(--gold-500) / .3); }
  .resend { text-align:center; font-size:12px; color:hsl(var(--ink-soft)); margin-top:14px; }
  .resend b { color:hsl(var(--lapis-800)); }
  .foot { text-align:center; padding:24px; font-size:13px; color:hsl(var(--ink-soft)); margin-top:auto; }
  .foot a { font-weight:700; color:hsl(var(--lapis-800)); }
</style>
</helmet>

<div class="top">
  <img src="logo-lapis-mark.png" alt="">
  <h1>تسجيل الدخول</h1>
  <p class="sub">أدخل بيانات حسابك في نايل كينجز</p>
  <div class="stepper"><span class="dot on"></span><span class="dot"></span></div>
</div>

<div class="card">
  <h3>1. رقم الهاتف وكلمة المرور</h3>
  <div class="field">
    <label>رقم الهاتف</label>
    <div class="phone-wrap">
      <input type="text" placeholder="1xxxxxxxxx" style="direction:ltr; text-align:left;">
      <span class="cc">+20</span>
    </div>
  </div>
  <div class="field" style="margin-bottom:6px;">
    <label>كلمة المرور</label>
    <input type="password" value="••••••••">
  </div>
  <div class="fwd"><a href="#">نسيت كلمة المرور؟</a></div>
  <button class="btn">متابعة</button>
</div>

<div class="card">
  <h3>2. رمز التحقق (OTP)</h3>
  <p style="font-size:13px; color:hsl(var(--ink-soft)); margin:-8px 0 14px;">تم إرسال رمز مكوّن من 4 أرقام إلى ‎01xxxxxxxxx</p>
  <div class="otp-boxes">
    <div class="otp-box filled">7</div>
    <div class="otp-box filled">3</div>
    <div class="otp-box active">9</div>
    <div class="otp-box">&nbsp;</div>
  </div>
  <button class="btn">تأكيد</button>
  <p class="resend">إعادة الإرسال بعد <b>00:45</b></p>
</div>

<div class="foot">ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a></div>

</x-dc>
</body>
</html>
